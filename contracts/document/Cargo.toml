[package]
name = "document"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils", "alloc"] }
# Test-only: lets the cross-contract validation in `register_document` be
# exercised against the real shipment contract rather than a stub. It is a dev
# dependency on purpose — linking it into the cdylib would export the shipment
# contract's own entrypoints from `document.wasm`.
shipment = { path = "../shipment", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
